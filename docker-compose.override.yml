services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    volumes:
      - ./apps/server:/app/apps/server
      - ./packages/go:/app/packages/go
      - uploads_data:/data/uploads
      - go_mod_cache:/go/pkg/mod
    command: ["air", "-c", ".air.toml"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile.dev
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages/go:/app/packages/go
      - uploads_data:/data/uploads
      - go_mod_cache:/go/pkg/mod
    command: ["air", "-c", ".air.toml"]

  cdn:
    build:
      context: .
      dockerfile: apps/cdn/Dockerfile.dev
    volumes:
      - ./apps/cdn:/app/apps/cdn
      - ./packages/go:/app/packages/go
      - uploads_data:/data/uploads:ro
      - go_mod_cache:/go/pkg/mod
    command: ["air", "-c", ".air.toml"]

  # Web Frontend with hot-reload (pnpm monorepo)
  web:
    image: node:lts-alpine
    container_name: docix-web
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm --filter web dev"]
    profiles:
      - frontend

  # Admin Frontend with hot-reload (pnpm monorepo)
  admin:
    image: node:lts-alpine
    container_name: docix-admin
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm --filter admin dev"]
    profiles:
      - frontend

volumes:
  go_mod_cache:
  pnpm_store:
  node_modules:
